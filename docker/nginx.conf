# Cloud Run runs nginx in foreground via supervisord.
# It listens on $PORT (default 8080) which is injected by Cloud Run.

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    access_log /dev/stdout;
    client_max_body_size 16M;

    # The PORT env var is rendered into the listen directive at container start
    # (see docker/start.sh which substitutes ${PORT} into this template).
    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;

        root /var/www/html/public;
        index index.php index.html;

        # Pass real client IP from Cloud Run's load balancer.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Cache hashed Vite assets aggressively (the hash in the filename busts the cache).
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        # Deny access to sensitive files.
        location ~ /\.(?!well-known) {
            deny all;
        }

        # Lightweight healthcheck endpoint that Cloud Run can ping.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
