; PHP-FPM pool tuned for a small Cloud Run instance (512Mi / 1 vCPU).

[www]
listen = 127.0.0.1:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Send PHP errors to container stderr (Cloud Run captures it).
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
clear_env = no
