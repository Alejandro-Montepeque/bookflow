name: CI + Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: bookflow-app
  REPO: bookflow
  IMAGE_NAME: app

jobs:
  # ----------------------------------------------------------------
  # 1. Run the test suite against a real Postgres 17.
  # ----------------------------------------------------------------
  test:
    name: Pest tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, intl, bcmath, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Build frontend assets (Vite)
        # Inertia tests that assert page renders need the Vite manifest to exist
        # at public/build/manifest.json. Without this, @vite() in the Blade root
        # view fails before Inertia can respond.
        run: npm run build

      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=localhost|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=testing|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=sail|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=password|' .env

      - name: Generate APP_KEY
        run: php artisan key:generate --ansi

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..15}; do
            if pg_isready -h localhost -U sail; then echo "Postgres ready"; exit 0; fi
            echo "Waiting for Postgres ($i/15)…"; sleep 2
          done
          echo "Postgres did not become ready in time"; exit 1

      - name: Run Pest
        run: php artisan test

  # ----------------------------------------------------------------
  # 2. Build the image and deploy to Cloud Run (main branch only).
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe $REPO \
            --location=$REGION --project=$PROJECT_ID 2>/dev/null || \
          gcloud artifacts repositories create $REPO \
            --repository-format=docker \
            --location=$REGION \
            --project=$PROJECT_ID

      - name: Build and push image
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME:${{ github.sha }}
          gcloud run deploy $SERVICE \
            --image=$IMAGE \
            --region=$REGION \
            --project=$PROJECT_ID \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --timeout=60 \
            --set-secrets=APP_KEY=app-key:latest,DB_URL=database-url:latest \
            --set-env-vars="APP_NAME=BookFlow,APP_ENV=production,APP_DEBUG=false,APP_URL=${{ secrets.APP_URL }},LOG_CHANNEL=stderr,LOG_LEVEL=info,DB_CONNECTION=pgsql,SESSION_DRIVER=database,SESSION_SECURE_COOKIE=true,CACHE_STORE=database,QUEUE_CONNECTION=database,MAIL_MAILER=log,MAIL_FROM_ADDRESS=no-reply@bookflow.app,MAIL_FROM_NAME=BookFlow"

      - name: Show service URL
        run: |
          gcloud run services describe $SERVICE \
            --region=$REGION \
            --project=$PROJECT_ID \
            --format='value(status.url)'
